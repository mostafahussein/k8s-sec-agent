apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-sec-agent.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-sec-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "k8s-sec-agent.serviceSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-sec-agent.serviceSelector" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-sec-agent.serviceName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: UPSTREAM_LLM_URL
              value: {{ .Values.upstream.url | quote }}
            - name: UPSTREAM_TIMEOUT
              value: {{ .Values.upstream.timeout | quote }}
            - name: KAGENT_TOOL_SERVER_URL
              value: {{ .Values.toolServer.url | quote }}
            - name: KUBE_BENCH_IMAGE
              value: {{ .Values.kubeBench.image | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
